<div class="dashboard-page">
  <header class="dashboard-header">
    <div>
      <h1>DriveMate</h1>
      <p>Driver Dashboard</p>
    </div>

    <div class="header-actions">
      <button type="button" class="profile-button" (click)="goToProfile()">Profile</button>

      <button type="button" class="logout-button" (click)="logout()">Logout</button>
    </div>
  </header>

  <main class="dashboard-content">
    <section class="welcome-section">
      <h2>Welcome, Driver</h2>
      <p>Manage your availability and respond to customer driver requests.</p>
    </section>

    <section class="dashboard-actions">
      <div class="action-card">
        <h3>Driver Requests</h3>

        <p>View available customer requests and manage your accepted rides.</p>

        <button type="button" (click)="viewRequests()">View Requests</button>
      </div>

      <div class="action-card">
        <h3>Availability</h3>

        <p>Manage when you are available to accept driver requests.</p>

        <button type="button" (click)="viewRequests()">View Requests</button>
      </div>
    </section>
  </main>
</div>
